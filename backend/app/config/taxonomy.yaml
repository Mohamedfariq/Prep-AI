# Topic Taxonomy for Smart Prep (PrepAI)
# ~40 Topics categorized into DSA, CS Fundamentals, and Programming Languages

topics:
  # Data Structures & Algorithms (DSA)
  - id: "arrays"
    name: "Arrays"
    category: "DSA"
    description: "Array manipulations, prefix sums, two pointers, sliding window"
  - id: "strings"
    name: "Strings"
    category: "DSA"
    description: "String matching, palindromes, anagrams, parsing"
  - id: "linked-lists"
    name: "Linked Lists"
    category: "DSA"
    description: "Singly, doubly, cycle detection, reversals"
  - id: "stacks-queues"
    name: "Stacks & Queues"
    category: "DSA"
    description: "Monotonic stacks, queue implementations, priority queues"
  - id: "trees"
    name: "Binary Trees"
    category: "DSA"
    description: "Traversals (In/Pre/Post/Level), tree properties, LCA"
  - id: "binary-search-trees"
    name: "Binary Search Trees (BST)"
    category: "DSA"
    description: "Search, insertion, deletion, validation, AVL/Red-Black basics"
  - id: "graphs"
    name: "Graphs"
    category: "DSA"
    description: "BFS, DFS, Dijkstra, Bellman-Ford, topological sort, MST"
  - id: "dynamic-programming"
    name: "Dynamic Programming"
    category: "DSA"
    description: "1D/2D DP, knapsack, LCS, LIS, state compression"
  - id: "greedy"
    name: "Greedy Algorithms"
    category: "DSA"
    description: "Interval scheduling, Huffman coding, fractional knapsack"
  - id: "binary-search"
    name: "Binary Search"
    category: "DSA"
    description: "Search space reduction, rotated array, upper/lower bounds"
  - id: "sliding-window"
    name: "Sliding Window"
    category: "DSA"
    description: "Fixed and dynamic window problems, max/min subarray"
  - id: "two-pointers"
    name: "Two Pointers"
    category: "DSA"
    description: "Fast-slow pointers, bidirectional inward search"
  - id: "heaps"
    name: "Heaps & Priority Queues"
    category: "DSA"
    description: "Min-heap, max-heap, top-k elements, median stream"
  - id: "backtracking"
    name: "Backtracking"
    category: "DSA"
    description: "N-Queens, permutations, subsets, Sudoku solver"
  - id: "trie"
    name: "Trie (Prefix Tree)"
    category: "DSA"
    description: "Prefix search, autocomplete, bitwise XOR trie"
  - id: "bit-manipulation"
    name: "Bit Manipulation"
    category: "DSA"
    description: "Bitwise ops, masking, subsets, XOR tricks"
  - id: "recursion"
    name: "Recursion & Divide and Conquer"
    category: "DSA"
    description: "Merge sort, quick sort, Master theorem, recursion trees"
  - id: "hashing"
    name: "Hashing & Hash Tables"
    category: "DSA"
    description: "Collision resolution, hash maps, frequency tables"

  # Core CS Fundamentals
  - id: "operating-systems"
    name: "Operating Systems"
    category: "CS Fundamentals"
    description: "Processes, threads, CPU scheduling, memory management, virtual memory"
  - id: "concurrency-sync"
    name: "Concurrency & Deadlocks"
    category: "CS Fundamentals"
    description: "Mutex, semaphores, deadlock detection/avoidance, race conditions"
  - id: "dbms-core"
    name: "DBMS & SQL"
    category: "CS Fundamentals"
    description: "Relational model, ACID properties, normalization, indexing, joins"
  - id: "transactions-indexing"
    name: "Transactions & B-Trees"
    category: "CS Fundamentals"
    description: "Isolation levels, 2PL, MVCC, B+ tree indexing vs hash index"
  - id: "computer-networks"
    name: "Computer Networks"
    category: "CS Fundamentals"
    description: "OSI model, TCP/IP, UDP, 3-way handshake, flow/congestion control"
  - id: "application-protocols"
    name: "Application Protocols"
    category: "CS Fundamentals"
    description: "HTTP/1.1 vs HTTP/2/3, DNS, SSL/TLS handshake, WebSockets"
  - id: "oop-design"
    name: "Object-Oriented Design (LLD)"
    category: "CS Fundamentals"
    description: "Encapsulation, inheritance, polymorphism, abstraction, SOLID principles"
  - id: "design-patterns"
    name: "Design Patterns"
    category: "CS Fundamentals"
    description: "Singleton, Factory, Observer, Strategy, Decorator, Adapter"
  - id: "system-design-hld"
    name: "System Design (HLD)"
    category: "CS Fundamentals"
    description: "Scalability, load balancing, caching (Redis), CAP theorem, CDN"

  # Core Languages & Development
  - id: "python-lang"
    name: "Python"
    category: "Languages"
    description: "Generators, decorators, GIL, memory management, list comprehensions"
  - id: "java-lang"
    name: "Java"
    category: "Languages"
    description: "JVM architecture, Garbage Collection, multithreading, collections framework"
  - id: "cpp-lang"
    name: "C++"
    category: "Languages"
    description: "Pointers, references, memory allocation, STL, virtual functions, RAII"
  - id: "javascript-lang"
    name: "JavaScript / TypeScript"
    category: "Languages"
    description: "Event loop, promises, async/await, closures, prototypes, TypeScript types"
  - id: "sql-queries"
    name: "SQL Query Crafting"
    category: "Languages"
    description: "Complex queries, window functions, CTEs, GROUP BY, aggregations"
